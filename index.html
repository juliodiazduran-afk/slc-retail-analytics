<style>
:root{
  --surface-1:#fcfcfb; --surface-2:#ffffff; --page-plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid-hairline:#e1e0d9; --border-ring: rgba(0,0,0,0.08);
  --series-1:#2a78d6;
  --status-good:#0ca30c; --status-good-bg:#e4f6e4;
  --status-warning:#c98500; --status-warning-bg:#fdf0d6;
  --status-serious:#d9622f; --status-serious-bg:#fbe4d8;
  --status-critical:#d03b3b; --status-critical-bg:#fbdede;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface-1:#1a1a19; --surface-2:#222221; --page-plane:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid-hairline:#2c2c2a; --border-ring: rgba(255,255,255,0.10);
    --series-1:#3987e5;
    --status-good:#28c228; --status-good-bg:#0f2a12;
    --status-warning:#e0a417; --status-warning-bg:#332608;
    --status-serious:#e97a49; --status-serious-bg:#3a2211;
    --status-critical:#f05a5a; --status-critical-bg:#3a1414;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --surface-1:#1a1a19; --surface-2:#222221; --page-plane:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid-hairline:#2c2c2a; --border-ring: rgba(255,255,255,0.10);
  --series-1:#3987e5;
  --status-good:#28c228; --status-good-bg:#0f2a12;
  --status-warning:#e0a417; --status-warning-bg:#332608;
  --status-serious:#e97a49; --status-serious-bg:#3a2211;
  --status-critical:#f05a5a; --status-critical-bg:#3a1414;
  --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; }
body{
  background: var(--page-plane); color: var(--text-primary);
  font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  font-size:15px; line-height:1.4;
  min-height:100vh;
  overscroll-behavior-y: contain;
}
.viz-root{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

button, input{ font-family:inherit; }

/* ---------------- Login gate ---------------- */
.gate{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
.gate-logo{ width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg, var(--series-1), #1baf7a); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:22px; margin-bottom:18px; box-shadow: var(--shadow); }
.gate h1{ font-size:19px; margin:0 0 4px; }
.gate .sub{ color:var(--text-secondary); font-size:13.5px; margin:0 0 26px; max-width:320px; }
.gate-form{ width:100%; max-width:280px; }
.code-input{
  width:100%; text-align:center; letter-spacing:6px; font-size:22px; font-weight:700;
  padding:14px 10px; border-radius:12px; border:1.5px solid var(--grid-hairline);
  background:var(--surface-2); color:var(--text-primary); text-transform:uppercase;
  outline:none;
}
.code-input:focus{ border-color: var(--series-1); }
.gate-btn{
  margin-top:14px; width:100%; padding:13px; border-radius:12px; border:none;
  background:var(--series-1); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
}
.gate-btn:active{ opacity:0.85; }
.gate-error{ color:var(--status-critical); font-size:13px; margin-top:12px; min-height:16px; }
.gate-foot{ margin-top:34px; color:var(--text-muted); font-size:11.5px; }

.quick-access{ width:100%; max-width:280px; margin-top:26px; padding-top:22px; border-top:1px solid var(--grid-hairline); }
.quick-access-title{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; font-weight:700; margin-bottom:10px; }
.quick-access-btn{ display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px; border-radius:10px; border:1.5px solid var(--grid-hairline); background:var(--surface-2); color:var(--text-primary); font-size:13px; font-weight:700; cursor:pointer; }
.quick-access-btn:active{ background:var(--page-plane); }

/* ---------------- Shell ---------------- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface-1);
  border-bottom:1px solid var(--grid-hairline); padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.topbar-brand{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
.topbar-name{ font-size:16px; font-weight:800; margin-top:1px; }
.logout-btn{ background:none; border:1px solid var(--grid-hairline); color:var(--text-secondary); font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; }

.content{ flex:1; padding:14px 14px 40px; }

/* Month chips */
.month-scroll{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; -webkit-overflow-scrolling:touch; }
.month-scroll::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1.5px solid var(--grid-hairline);
  background:var(--surface-2); color:var(--text-secondary); font-size:12.5px; font-weight:700; cursor:pointer;
  white-space:nowrap; position:relative;
}
.chip.active{ background:var(--series-1); border-color:var(--series-1); color:#fff; }
.chip .dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.55; margin-left:5px; vertical-align:middle; }

/* KPI cards */
.kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.kpi-card{ background:var(--surface-2); border:1px solid var(--grid-hairline); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow); }
.kpi-label{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; font-weight:700; margin-bottom:6px; }
.kpi-value{ font-size:19px; font-weight:800; letter-spacing:-0.3px; }
.kpi-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:3px; }
.kpi-card.wide{ grid-column:1 / -1; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:800; white-space:nowrap; flex-shrink:0; }
.pill.good{ background:var(--status-good-bg); color:var(--status-good); }
.pill.warning{ background:var(--status-warning-bg); color:var(--status-warning); }
.pill.serious{ background:var(--status-serious-bg); color:var(--status-serious); }
.pill.critical{ background:var(--status-critical-bg); color:var(--status-critical); }
.pill.neutral{ background:var(--grid-hairline); color:var(--text-secondary); }

.var-up{ color:var(--status-good); font-weight:700; }
.var-down{ color:var(--status-critical); font-weight:700; }

/* Section headers */
.section{ margin-bottom:20px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
.section-title{ font-size:14.5px; font-weight:800; }
.section-note{ font-size:11.5px; color:var(--text-muted); }

/* Trend chart */
.trend-card{ background:var(--surface-2); border:1px solid var(--grid-hairline); border-radius:14px; padding:14px 12px 10px; box-shadow:var(--shadow); }
.trend-legend{ display:flex; gap:14px; font-size:11px; color:var(--text-secondary); margin-top:6px; padding-left:2px; }
.legend-dot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }

/* Store cards */
.store-card{ background:var(--surface-2); border:1px solid var(--grid-hairline); border-radius:12px; padding:11px 13px; margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; }
.store-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.store-top > div:first-child{ min-width:0; flex:1 1 auto; }
.store-top > div:last-child{ flex:0 0 auto; }
.store-name{ font-size:13.5px; font-weight:700; }
.store-pais{ font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:1px; }
.store-bar-wrap{ height:6px; background:var(--grid-hairline); border-radius:4px; margin-top:9px; overflow:hidden; }
.store-bar{ height:100%; border-radius:4px; }
.store-nums{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:5px; }
.store-detail{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--grid-hairline); display:none; }
.store-detail.open{ display:block; }
.store-detail-months{ display:flex; justify-content:space-between; gap:4px; }
.sdm{ text-align:center; flex:1; }
.sdm-bar-wrap{ height:38px; display:flex; align-items:flex-end; justify-content:center; }
.sdm-bar{ width:14px; border-radius:3px 3px 0 0; }
.sdm-lbl{ font-size:9.5px; color:var(--text-muted); margin-top:3px; }
.sdm-pct{ font-size:9px; font-weight:700; margin-top:1px; }

/* Sellers */
.seller-row{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--grid-hairline); }
.seller-row:last-child{ border-bottom:none; }
.seller-rank{ width:22px; height:22px; border-radius:50%; background:var(--page-plane); border:1px solid var(--grid-hairline); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--text-secondary); flex:0 0 auto; }
.seller-rank.top1{ background:#f4d35e; border-color:#e0b93a; color:#5a4300; }
.seller-rank.top2{ background:#dcdcdc; border-color:#c3c3c3; color:#3a3a3a; }
.seller-rank.top3{ background:#e7bb8f; border-color:#cf9c68; color:#4a2f10; }
.seller-info{ flex:1; min-width:0; }
.seller-name{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seller-store{ font-size:10.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seller-nums{ text-align:right; flex:0 0 auto; }
.seller-usd{ font-size:12.5px; font-weight:800; }
.seller-delta{ font-size:10px; margin-top:1px; }
.sellers-card{ background:var(--surface-2); border:1px solid var(--grid-hairline); border-radius:14px; padding:6px 12px; box-shadow:var(--shadow); }
.seller-show-more{ text-align:center; padding:10px 0 2px; font-size:12px; color:var(--series-1); font-weight:700; cursor:pointer; }

.footer-note{ text-align:center; color:var(--text-muted); font-size:11px; padding:6px 20px 0; }

.empty-note{ text-align:center; color:var(--text-muted); font-size:12.5px; padding:18px 10px; }

</style>

<script>
(function(){
'use strict';
var DATA = window.__SLC_MOBILE__;
var META = DATA.meta;
var MES_ABR = META.mesNomAbr;
var PAIS_NOM = META.paisNom || {'SLC-GT':'Guatemala','SLC-SV':'El Salvador','SLC-HN':'Honduras','SLC-CR':'Costa Rica'};
var ROL_LABEL = {supervisor:'Supervisor de tienda', pais:'Head de País', direccion:'Dirección / Gerencia'};

var root = document.getElementById('app-root');
var STATE = { code:null, scope:null, monthIdx:null, openStore:null, sellersExpanded:false, storesExpanded:false, paisFiltro:null };

// ---------------- formatting helpers ----------------
function fmtUSDCompact(v){
  if (v==null || isNaN(v)) return 's/d';
  var sign = v<0 ? '-' : '';
  var a = Math.abs(v);
  if (a>=1000000) return sign+'$'+(a/1000000).toFixed(a>=10000000?1:2)+'M';
  if (a>=1000) return sign+'$'+(a/1000).toFixed(a>=10000?0:1)+'K';
  return sign+'$'+a.toFixed(0);
}
function fmtPct(v){
  if (v==null || isNaN(v)) return 's/d';
  return (v*100).toFixed(0)+'%';
}
function statusInfo(cumpl){
  if (cumpl==null || isNaN(cumpl)) return {cls:'neutral', icon:'', color:'var(--text-muted)'};
  if (cumpl>=0.95) return {cls:'good', icon:'✓', color:'var(--status-good)'};
  if (cumpl>=0.80) return {cls:'warning', icon:'△', color:'var(--status-warning)'};
  if (cumpl>=0.60) return {cls:'serious', icon:'▽', color:'var(--status-serious)'};
  return {cls:'critical', icon:'✕', color:'var(--status-critical)'};
}
function monthLabel(a,m,short){
  var ab = MES_ABR[String(m)];
  return short ? ab : (ab+' '+a);
}
function isPartialMonth(a,m){
  return a===META.mesActual.a && m===META.mesActual.m;
}
function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html!=null) e.innerHTML = html;
  return e;
}
function paisNombre(p){ return PAIS_NOM[p]||p; }
function fmtFecha(iso){
  var parts = iso.split('-');
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ---------------- gate ----------------
function renderGate(errorMsg){
  root.innerHTML = '';
  var gate = el('div','gate');
  var logo = el('div','gate-logo','S');
  gate.appendChild(logo);
  gate.appendChild(el('h1',null,'SLC Retail Analytics'));
  gate.appendChild(el('p','sub','Panel ejecutivo — si eres supervisor, ingresa el código que te compartió tu gerente para ver el desempeño de tus tiendas.'));
  var form = el('form','gate-form');
  var input = document.createElement('input');
  input.className='code-input'; input.setAttribute('maxlength','6'); input.setAttribute('autocomplete','off');
  input.setAttribute('autocapitalize','characters'); input.placeholder='CÓDIGO';
  form.appendChild(input);
  var btn = el('button','gate-btn','Ingresar'); btn.type='submit';
  form.appendChild(btn);
  var err = el('div','gate-error', errorMsg||'');
  form.appendChild(err);
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var code = (input.value||'').trim().toUpperCase();
    if (!enterScope(code)){
      err.textContent = 'Código inválido. Verifica mayúsculas/minúsculas o solicita tu código nuevamente.';
      input.focus();
    }
  });
  gate.appendChild(form);
  gate.appendChild(el('div','gate-foot','Acceso exclusivo para personal autorizado de SLC. Si no tienes un código, contacta a tu gerente.'));

  var directEntries = Object.keys(DATA.codigos).filter(function(c){ return DATA.codigos[c].accesoDirecto; });
  if (directEntries.length){
    var qa = el('div','quick-access');
    qa.appendChild(el('div','quick-access-title','Accesos directos — dirección y países'));
    directEntries.sort(function(a,b){
      var sa=DATA.codigos[a], sb=DATA.codigos[b];
      if (sa.rol!==sb.rol) return sa.rol==='direccion' ? -1 : 1;
      return sa.nombre.localeCompare(sb.nombre);
    }).forEach(function(code){
      var scope = DATA.codigos[code];
      var label = scope.rol==='direccion' ? 'Dirección / Gerencia' : 'País — '+(scope.paisNombre||scope.paises.map(paisNombre).join(', '));
      var b = el('button','quick-access-btn', label);
      b.type='button';
      b.addEventListener('click', function(){ enterScope(code); });
      qa.appendChild(b);
    });
    gate.appendChild(qa);
  }

  root.appendChild(gate);
  setTimeout(function(){ input.focus(); }, 50);
}

function enterScope(code){
  var scope = DATA.codigos[(code||'').trim().toUpperCase()];
  if (!scope) return false;
  STATE.code = code; STATE.scope = scope; STATE.monthIdx = scope.totales.length-1;
  STATE.openStore = null; STATE.sellersExpanded = false; STATE.storesExpanded = false; STATE.paisFiltro = null;
  renderApp();
  return true;
}

// ---------------- app shell ----------------
function renderApp(){
  root.innerHTML = '';
  var scope = STATE.scope;

  var topbar = el('div','topbar');
  var brandWrap = el('div');
  var roleLine = ROL_LABEL[scope.rol] || scope.rol;
  if (scope.rol==='pais') roleLine += ' — ' + (scope.paisNombre||'');
  brandWrap.appendChild(el('div','topbar-brand', roleLine));
  brandWrap.appendChild(el('div','topbar-name', escapeHtml(scope.nombre)));
  topbar.appendChild(brandWrap);
  var logoutBtn = el('button','logout-btn','Salir');
  logoutBtn.addEventListener('click', function(){
    STATE = {code:null,scope:null,monthIdx:null,openStore:null,sellersExpanded:false,storesExpanded:false,paisFiltro:null};
    renderGate();
  });
  topbar.appendChild(logoutBtn);
  root.appendChild(topbar);

  var content = el('div','content');
  root.appendChild(content);

  content.appendChild(buildMonthChips());
  content.appendChild(buildKpis());
  if (scope.porPais) content.appendChild(buildPorPais());
  if (scope.porSupervisor) content.appendChild(buildPorSupervisor());
  content.appendChild(buildTrend());
  content.appendChild(buildCategorias());
  content.appendChild(buildStores());
  content.appendChild(buildSellers());

  var paisTxt = scope.paises.map(paisNombre).join(' · ');
  var alcanceTxt = scope.rol==='direccion' ? (scope.tiendas.length+' tiendas en '+scope.paises.length+' países')
    : (scope.tiendas.length+' tienda(s) · '+paisTxt);
  content.appendChild(el('div','footer-note', 'Datos al '+fmtFecha(META.fechaMax)+' · '+alcanceTxt));
}

// ---------------- month chips ----------------
function buildMonthChips(){
  var wrap = el('div','month-scroll');
  var scope = STATE.scope;
  scope.totales.forEach(function(row, idx){
    var chip = el('div','chip'+(idx===STATE.monthIdx?' active':''));
    chip.textContent = monthLabel(row.a, row.m, true)+' '+String(row.a).slice(2);
    if (isPartialMonth(row.a,row.m)) chip.appendChild(el('span','dot',''));
    chip.addEventListener('click', function(){ STATE.monthIdx = idx; STATE.openStore=null; renderApp(); });
    wrap.appendChild(chip);
  });
  return wrap;
}

// ---------------- KPIs ----------------
function buildKpis(){
  var scope = STATE.scope;
  var row = scope.totales[STATE.monthIdx];
  var cumpl = row.ppto>0 ? row.usd/row.ppto : null;
  var st = statusInfo(cumpl);
  var varYoy = (row.usdYoy>0) ? (row.usd-row.usdYoy)/row.usdYoy : null;

  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title', monthLabel(row.a,row.m,false)+(isPartialMonth(row.a,row.m)?' (parcial)':'')));
  if (isPartialMonth(row.a,row.m)) head.appendChild(el('div','section-note','al día '+META.cutoffDay));
  sec.appendChild(head);

  var grid = el('div','kpi-grid');

  var c1 = el('div','kpi-card');
  c1.appendChild(el('div','kpi-label','Venta del mes'));
  c1.appendChild(el('div','kpi-value', fmtUSDCompact(row.usd)));
  if (varYoy!=null){
    c1.appendChild(el('div','kpi-sub', '<span class="'+(varYoy>=0?'var-up':'var-down')+'">'+(varYoy>=0?'▲':'▼')+' '+Math.abs(varYoy*100).toFixed(0)+'%</span> vs '+monthLabel(row.a-1,row.m,true)+' '+String(row.a-1).slice(2)));
  } else {
    c1.appendChild(el('div','kpi-sub','sin dato del año anterior'));
  }
  grid.appendChild(c1);

  var c2 = el('div','kpi-card');
  c2.appendChild(el('div','kpi-label','Meta del mes'));
  c2.appendChild(el('div','kpi-value', row.ppto>0 ? fmtUSDCompact(row.ppto) : 's/d'));
  c2.appendChild(el('div','kpi-sub', scope.tiendas.length+' tienda(s)'));
  grid.appendChild(c2);

  var c3 = el('div','kpi-card wide');
  var c3left = el('div');
  c3left.appendChild(el('div','kpi-label','% Cumplimiento de meta'));
  var pillHtml = '<span class="pill '+st.cls+'">'+(st.icon?st.icon+' ':'')+fmtPct(cumpl)+'</span>';
  c3left.appendChild(el('div',null, pillHtml));
  c3.appendChild(c3left);
  grid.appendChild(c3);

  sec.appendChild(grid);
  return sec;
}

// ---------------- por país (director) ----------------
function buildPorPais(){
  var scope = STATE.scope;
  var rows = scope.porPais[mkeyOf(STATE.monthIdx)] || [];
  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title','Por país'));
  head.appendChild(el('div','section-note','toca para filtrar tiendas'));
  sec.appendChild(head);
  var card = el('div','sellers-card');
  rows.forEach(function(r){
    var cumpl = r.ppto>0 ? r.usd/r.ppto : null;
    var st = statusInfo(cumpl);
    var row = el('div','seller-row');
    row.style.cursor = 'pointer';
    var info = el('div','seller-info');
    info.appendChild(el('div','seller-name', paisNombre(r.pais) + (STATE.paisFiltro===r.pais ? ' ✓' : '')));
    info.appendChild(el('div','seller-store', fmtUSDCompact(r.usd)+' de '+(r.ppto>0?fmtUSDCompact(r.ppto):'s/d')));
    row.appendChild(info);
    row.appendChild(el('div',null,'<span class="pill '+st.cls+'">'+(st.icon?st.icon+' ':'')+fmtPct(cumpl)+'</span>'));
    row.addEventListener('click', function(){
      STATE.paisFiltro = STATE.paisFiltro===r.pais ? null : r.pais;
      STATE.storesExpanded = false;
      renderApp();
    });
    card.appendChild(row);
  });
  sec.appendChild(card);
  return sec;
}

// ---------------- por supervisor (pais / direccion) ----------------
function buildPorSupervisor(){
  var scope = STATE.scope;
  var rows = (scope.porSupervisor[mkeyOf(STATE.monthIdx)] || []).slice();
  rows.sort(function(a,b){
    var av = a.ppto>0 ? a.usd/a.ppto : 0.5001;
    var bv = b.ppto>0 ? b.usd/b.ppto : 0.5001;
    return av-bv;
  });
  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title','Por supervisor ('+rows.length+')'));
  head.appendChild(el('div','section-note','ordenado por % cumplimiento'));
  sec.appendChild(head);
  var card = el('div','sellers-card');
  rows.forEach(function(r){
    var cumpl = r.ppto>0 ? r.usd/r.ppto : null;
    var st = statusInfo(cumpl);
    var row = el('div','seller-row');
    var info = el('div','seller-info');
    info.appendChild(el('div','seller-name', escapeHtml(r.supervisor)));
    info.appendChild(el('div','seller-store', r.tiendas+' tienda(s) · '+fmtUSDCompact(r.usd)));
    row.appendChild(info);
    row.appendChild(el('div',null,'<span class="pill '+st.cls+'">'+(st.icon?st.icon+' ':'')+fmtPct(cumpl)+'</span>'));
    card.appendChild(row);
  });
  sec.appendChild(card);
  return sec;
}

// ---------------- trend chart ----------------
function buildTrend(){
  var scope = STATE.scope;
  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title','Tendencia — últimos '+scope.totales.length+' meses'));
  sec.appendChild(head);

  var card = el('div','trend-card');
  var W = 480, H = 130, padL=8, padR=8, padT=10, padB=20;
  var innerW = W-padL-padR;
  var n = scope.totales.length;
  var bw = innerW/n*0.5;
  var maxV = Math.max.apply(null, scope.totales.map(function(r){ return Math.max(r.usd, r.ppto||0); })) || 1;
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">';
  scope.totales.forEach(function(row, i){
    var slot = innerW/n;
    var cx = padL + slot*i + slot/2;
    var cumpl = row.ppto>0 ? row.usd/row.ppto : null;
    var st = statusInfo(cumpl);
    var barH = (row.usd/maxV) * (H-padT-padB);
    var y = H-padB-barH;
    svg += '<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(barH,1)+'" rx="3" fill="'+st.color+'" opacity="'+(i===STATE.monthIdx?'1':'0.55')+'"></rect>';
    if (row.ppto>0){
      var yPpto = H-padB-(row.ppto/maxV)*(H-padT-padB);
      svg += '<line x1="'+(cx-bw/2-3)+'" x2="'+(cx+bw/2+3)+'" y1="'+yPpto+'" y2="'+yPpto+'" stroke="var(--text-secondary)" stroke-width="2" stroke-dasharray="2,2"></line>';
    }
    svg += '<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--text-muted)" font-family="Arial">'+monthLabel(row.a,row.m,true)+'</text>';
  });
  svg += '</svg>';
  card.innerHTML = svg;
  var legend = el('div','trend-legend');
  legend.innerHTML = '<span><span class="legend-dot" style="background:var(--series-1)"></span>Venta</span>'+
    '<span><span class="legend-dot" style="background:none;border-top:2px dashed var(--text-secondary);height:0;"></span>Meta</span>';
  card.appendChild(legend);
  sec.appendChild(card);
  return sec;
}

// ---------------- categorias ----------------
function mkeyOf(idx){
  var row = STATE.scope.totales[idx];
  return row.a+'-'+(row.m<10?'0':'')+row.m;
}
function buildCategorias(){
  var scope = STATE.scope;
  var rows = (scope.categorias[mkeyOf(STATE.monthIdx)] || []).slice();
  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title','Ventas por categoría'));
  head.appendChild(el('div','section-note','meta solo en Telefonía, Línea Blanca y AV'));
  sec.appendChild(head);

  if (!rows.length){
    var c0 = el('div','sellers-card');
    c0.appendChild(el('div','empty-note','Sin ventas por categoría registradas en este mes.'));
    sec.appendChild(c0);
    return sec;
  }

  var maxUsd = Math.max.apply(null, rows.map(function(r){return r.usd;})) || 1;
  var card = el('div','sellers-card');
  rows.forEach(function(r){
    var cumpl = r.ppto>0 ? r.usd/r.ppto : null;
    var st = statusInfo(cumpl);
    var wrap = el('div');
    wrap.style.padding = '9px 2px';
    wrap.style.borderBottom = '1px solid var(--grid-hairline)';
    var top = el('div');
    top.style.display='flex'; top.style.justifyContent='space-between'; top.style.alignItems='center'; top.style.gap='8px';
    var left = el('div',null, '<div style="font-size:12.5px;font-weight:700;">'+escapeHtml(catLabel(r.categoria))+'</div><div style="font-size:10.5px;color:var(--text-muted);margin-top:1px;">'+fmtUSDCompact(r.usd)+'</div>');
    top.appendChild(left);
    if (r.ppto>0){
      top.appendChild(el('div',null,'<span class="pill '+st.cls+'">'+(st.icon?st.icon+' ':'')+fmtPct(cumpl)+'</span>'));
    }
    wrap.appendChild(top);
    var barWrap = el('div','store-bar-wrap');
    var bar = el('div','store-bar');
    bar.style.width = Math.max((r.usd/maxUsd)*100,2)+'%';
    bar.style.background = r.ppto>0 ? st.color : 'var(--series-1)';
    barWrap.appendChild(bar);
    wrap.appendChild(barWrap);
    card.appendChild(wrap);
  });
  card.lastChild.style.borderBottom = 'none';
  sec.appendChild(card);
  return sec;
}
function catLabel(c){
  var m = {'TELEFONIA Y ACC':'Telefonía y Accesorios','LINEA BLANCA':'Línea Blanca','AUDIO Y VIDEO':'Audio y Video',
    'PROMOCIONALES':'Promocionales','REPUESTOS':'Repuestos','Artículos':'Artículos','SERVICIOS':'Servicios',
    'SIN CATEGORIA':'Sin categoría','GAMING':'Gaming'};
  return m[c]||c;
}

// ---------------- stores ----------------
function buildStores(){
  var scope = STATE.scope;
  var mIdx = STATE.monthIdx;

  var showPaisChips = scope.paises.length>1;

  var list = scope.tiendas.filter(function(t){
    return !STATE.paisFiltro || t.pais===STATE.paisFiltro;
  }).map(function(t){
    var m = t.meses[mIdx];
    var cumpl = m.ppto>0 ? m.usd/m.ppto : null;
    return {t:t, m:m, cumpl:cumpl};
  });
  list.sort(function(a,b){
    var av = a.cumpl==null ? 0.5001 : a.cumpl;
    var bv = b.cumpl==null ? 0.5001 : b.cumpl;
    return av-bv;
  });

  var sec = el('div','section');
  var head = el('div','section-head');
  head.appendChild(el('div','section-title','Tiendas ('+list.length+')'));
  head.appendChild(el('div','section-note','ordenadas por % cumplimiento'));
  sec.appendChild(head);

  if (showPaisChips){
    var chipWrap = el('div','month-scroll');
    chipWrap.style.paddingBottom = '10px';
    var allChip = el('div','chip'+(!STATE.paisFiltro?' active':''),'Todos los países');
    allChip.addEventListener('click', function(){ STATE.paisFiltro=null; STATE.storesExpanded=false; renderApp(); });
    chipWrap.appendChild(allChip);
    scope.paises.forEach(function(p){
      var c = el('div','chip'+(STATE.paisFiltro===p?' active':''), paisNombre(p));
      c.addEventListener('click', function(){ STATE.paisFiltro = STATE.paisFiltro===p?null:p; STATE.storesExpanded=false; renderApp(); });
      chipWrap.appendChild(c);
    });
    sec.appendChild(chipWrap);
  }

  var LIMIT = 15;
  var showCount = STATE.storesExpanded ? list.length : Math.min(LIMIT, list.length);

  for (var i=0;i<showCount;i++){
    var item = list[i];
    var st = statusInfo(item.cumpl);
    var card = el('div','store-card');
    var top = el('div','store-top');
    var left = el('div');
    left.appendChild(el('div','store-name', escapeHtml(item.t.tienda)));
    var subLine = paisNombre(item.t.pais) + (item.t.supervisor ? ' · '+escapeHtml(item.t.supervisor) : '');
    left.appendChild(el('div','store-pais', subLine));
    top.appendChild(left);
    top.appendChild(el('div',null,'<span class="pill '+st.cls+'">'+(st.icon?st.icon+' ':'')+fmtPct(item.cumpl)+'</span>'));
    card.appendChild(top);

    var barWrap = el('div','store-bar-wrap');
    var bar = el('div','store-bar');
    var pct = item.cumpl==null ? 0 : Math.min(item.cumpl*100,100);
    bar.style.width = pct+'%';
    bar.style.background = st.color;
    barWrap.appendChild(bar);
    card.appendChild(barWrap);

    var nums = el('div','store-nums');
    nums.innerHTML = '<span>'+fmtUSDCompact(item.m.usd)+'</span><span>Meta: '+(item.m.ppto>0?fmtUSDCompact(item.m.ppto):'s/d')+'</span>';
    card.appendChild(nums);

    var storeKey = item.t.tienda+'~~'+item.t.pais;
    var detail = el('div','store-detail'+(STATE.openStore===storeKey?' open':''));
    detail.appendChild(buildStoreSpark(item.t));
    card.appendChild(detail);

    (function(storeKey){
      card.addEventListener('click', function(){
        STATE.openStore = STATE.openStore===storeKey ? null : storeKey;
        renderApp();
      });
    })(storeKey);

    sec.appendChild(card);
  }

  if (list.length>LIMIT){
    var more = el('div','seller-show-more', STATE.storesExpanded ? 'Ver menos' : 'Ver las '+list.length+' tiendas');
    more.addEventListener('click', function(){ STATE.storesExpanded = !STATE.storesExpanded; renderApp(); });
    sec.appendChild(more);
  }

  return sec;
}

function buildStoreSpark(t){
  var wrap = el('div','store-detail-months');
  var maxV = Math.max.apply(null, t.meses.map(function(m){ return Math.max(m.usd, m.ppto||0); })) || 1;
  t.meses.forEach(function(m){
    var cumpl = m.ppto>0 ? m.usd/m.ppto : null;
    var st = statusInfo(cumpl);
    var h = Math.max((m.usd/maxV)*34, 2);
    var col = el('div','sdm');
    var barWrap = el('div','sdm-bar-wrap');
    var bar = el('div','sdm-bar');
    bar.style.height = h+'px';
    bar.style.background = st.color;
    barWrap.appendChild(bar);
    col.appendChild(barWrap);
    col.appendChild(el('div','sdm-lbl', monthLabel(m.a,m.m,true)));
    col.appendChild(el('div','sdm-pct', fmtPct(cumpl)));
    col.lastChild.style.color = st.color;
    wrap.appendChild(col);
  });
  return wrap;
}

// ---------------- sellers ----------------
function buildSellers(){
  var scope = STATE.scope;
  var key = mkeyOf(STATE.monthIdx);
  var sellers = (scope.vendedoresPorMes[key] || []).filter(function(s){
    return !STATE.paisFiltro || (scope.tiendas.find(function(t){return t.tienda===s.tienda;})||{}).pais===STATE.paisFiltro;
  });

  var sec = el('div','section');
  var head = el('div','section-head');
  var row = scope.totales[STATE.monthIdx];
  head.appendChild(el('div','section-title','Ranking de vendedores'));
  head.appendChild(el('div','section-note', monthLabel(row.a,row.m,true)+' '+row.a));
  sec.appendChild(head);

  if (!sellers.length){
    var card0 = el('div','sellers-card');
    card0.appendChild(el('div','empty-note','Sin ventas por vendedor registradas en este mes.'));
    sec.appendChild(card0);
    return sec;
  }

  var card = el('div','sellers-card');
  var limit = STATE.sellersExpanded ? sellers.length : Math.min(10, sellers.length);
  for (var i=0;i<limit;i++){
    var s = sellers[i];
    var delta = s.usdPrev>0 ? (s.usd-s.usdPrev)/s.usdPrev : null;
    var rowEl = el('div','seller-row');
    var rankCls = i===0?' top1':i===1?' top2':i===2?' top3':'';
    rowEl.appendChild(el('div','seller-rank'+rankCls, String(i+1)));
    var info = el('div','seller-info');
    info.appendChild(el('div','seller-name', escapeHtml(s.vendedor)));
    info.appendChild(el('div','seller-store', escapeHtml(s.tienda)));
    rowEl.appendChild(info);
    var nums = el('div','seller-nums');
    nums.appendChild(el('div','seller-usd', fmtUSDCompact(s.usd)));
    if (delta!=null){
      nums.appendChild(el('div','seller-delta', '<span class="'+(delta>=0?'var-up':'var-down')+'">'+(delta>=0?'▲':'▼')+' '+Math.abs(delta*100).toFixed(0)+'%</span>'));
    } else {
      nums.appendChild(el('div','seller-delta',''));
    }
    rowEl.appendChild(nums);
    card.appendChild(rowEl);
  }
  sec.appendChild(card);

  if (sellers.length>10){
    var more = el('div','seller-show-more', STATE.sellersExpanded ? 'Ver menos' : 'Ver los '+sellers.length+' vendedores');
    more.addEventListener('click', function(){ STATE.sellersExpanded = !STATE.sellersExpanded; renderApp(); });
    sec.appendChild(more);
  }

  return sec;
}

// ---------------- boot ----------------
renderGate();
})();

</script>

    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('SW registration failed', err);
    });
  });
}
